name: CI

# Builds with the real Visual Studio toolchain on a Windows runner, checks that
# only in-box Windows DLLs are imported, runs the unit tests, and publishes the
# executables and screenshots of the UI.  Warnings fail the build (CL=/WX).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # the next step compares this branch with main

      - name: Warn if the UI changed but the documentation screenshots did not
        shell: cmd
        run: |
          git fetch --no-tags origin main
          git diff --name-only origin/main...HEAD > "%RUNNER_TEMP%\changed.txt"
          findstr /b /c:"src/ui/" /c:"src/core/asr_models.h" /c:"src/core/asr_languages.h" /c:"src/core/setup_status.cpp" /c:"src/engine/simulated_engine.cpp" "%RUNNER_TEMP%\changed.txt" >nul && (findstr /b /c:"docs/screenshots/" "%RUNNER_TEMP%\changed.txt" >nul || echo ::warning title=Documentation screenshots::src/ui, or a file whose words are in the pictures such as the models, the languages, the notification text and the demo script, changed but docs/screenshots did not. If the window looks different, run build.bat x64 screenshots and commit the pictures.)
          exit /b 0

      - name: Build, check imports and test (x64 and x86)
        shell: cmd
        env:
          CL: /WX
        run: build.bat

      - name: Render the UI scenarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path shots | Out-Null
          foreach ($scenario in 'idle', 'recording', 'mic-only', 'system-only', 'bluetooth-mic', 'clipping', 'saved', 'transcript', 'transcript-separate', 'transcript-saved', 'transcript-chinese', 'model', 'catching-up', 'enhancing', 'enhanced', 'enhance-failed', 'error', 'named', 'typing', 'hotkeys', 'hotkey-taken', 'setup-scan', 'setup-ask', 'setup-download', 'setup-done', 'setup-failed', 'setup-declined') {
            $run = Start-Process -FilePath bin\x64\Audior-GUI.exe -Wait -PassThru `
              -ArgumentList '--screenshot', "shots\$scenario.png", '--scenario', $scenario
            if ($run.ExitCode -ne 0) { throw "Scenario '$scenario' failed with exit code $($run.ExitCode)" }
          }
          # The narrowest window (940 DIP) with live transcripts, in the panes and between them: each header must still show its status.
          foreach ($scenario in 'transcript', 'transcript-separate') {
            $run = Start-Process -FilePath bin\x64\Audior-GUI.exe -Wait -PassThru `
              -ArgumentList '--screenshot', "shots\$scenario-narrow.png", '--scenario', $scenario, '--size', '940x740'
            if ($run.ExitCode -ne 0) { throw "The narrow $scenario scenario failed with exit code $($run.ExitCode)" }
          }

      - name: Drive the real application (command line, simulated and real engine)
        shell: powershell
        timeout-minutes: 5
        run: tests\ui_smoke.ps1 -Exe bin\x64\Audior-GUI.exe -Out shots

      - uses: actions/upload-artifact@v4
        if: always()                    # the pictures matter most when a step failed
        with:
          name: ui-screenshots
          path: shots/*.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: audior-gui-windows
          path: |
            bin/x64/Audior-GUI.exe
            bin/x64/audior_fetch.exe
            bin/x64/audior_fetch.sha256
            bin/x86/Audior-GUI.exe
            bin/x86/audior_fetch.exe
            bin/x86/audior_fetch.sha256
          retention-days: 14
